<mat-toolbar color="primary">
  <mat-toolbar-row>
    <button mat-button routerLink="/">FakeStore</button>
    <span class="spacer"></span>
    <button mat-button routerLink="/cart">
      <mat-icon>shopping_cart</mat-icon>
      <span *ngIf="itemCount > 0" matBadge="{{itemCount}}" matBadgeColor="accent"></span>
    </button>
  </mat-toolbar-row>
</mat-toolbar>
